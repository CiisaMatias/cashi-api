version: "3.9"

services:
  db:
    image: postgres:16
    container_name: cashi_db
    restart: always
    environment:
      POSTGRES_USER: cashi_user
      POSTGRES_PASSWORD: cashi_password
      POSTGRES_DB: cashi_db
    ports:
      - "5432:5432"
    volumes:
      - cashi_data:/var/lib/postgresql/data

volumes:
  cashi_data:
